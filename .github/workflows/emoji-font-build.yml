name: Windows Emoji Font Build

on:
  workflow_dispatch:
  push:
    branches:
      - emoji-font
    paths:
      - ".github/workflows/emoji-font-build.yml"
      - "espanso-modulo/src/sys/search/**"
      - "espanso-modulo/build.rs"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WX_WIDGETS_BUILD_OUT_DIR: ${{ github.workspace }}/target/wx-build

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Windows search renderer
        shell: pwsh
        run: |
          $checkRoot = Join-Path $env:RUNNER_TEMP "espanso-search-check"
          Expand-Archive "espanso-modulo/vendor/wxWidgets-3.1.5-patched-version-3.zip" -DestinationPath $checkRoot
          $configRoot = Join-Path $checkRoot "syntax-config"
          New-Item -ItemType Directory -Force "$configRoot/wx" | Out-Null
          Copy-Item "$checkRoot/include/wx/msw/setup.h" "$configRoot/wx/setup.h"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vs "VC/Auxiliary/Build/vcvars64.bat"
          $command = '"' + $vcvars + '" && cl /nologo /Zs /EHsc /utf-8 /I"' + $configRoot + '" /I"' + $checkRoot + '/include" espanso-modulo/src/sys/search/search.cpp'
          & cmd.exe /c $command
          if ($LASTEXITCODE -ne 0) { throw "Windows search syntax check failed." }

      - name: Cache wxWidgets
        uses: actions/cache@v4
        with:
          path: target/wx-build
          key: windows-wx-v1-${{ hashFiles('espanso-modulo/vendor/*.zip') }}

      - name: Build Espanso
        run: cargo build --release

      - name: Build Windows resources
        shell: pwsh
        run: |
          $env:EXEC_PATH = "target\release\espanso.exe"
          scripts\build_windows_resources.ps1

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          Install-Module -Name PSTOML -Force -Scope CurrentUser
          scripts\build_windows_installer.ps1

      - name: Build portable archive
        shell: pwsh
        run: scripts\build_windows_portable.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Espanso-Windows-Emoji-Font
          path: |
            target/windows/Espanso-Win-Installer-x86_64.exe
            target/windows/Espanso-Win-Portable-x86_64.zip
          if-no-files-found: error
