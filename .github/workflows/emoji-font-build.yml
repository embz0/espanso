name: Windows Emoji Font Build

on:
  workflow_dispatch:
  push:
    branches:
      - emoji-font
    paths:
      - ".github/workflows/emoji-font-build.yml"
      - "espanso-modulo/src/sys/search/**"
      - "espanso-modulo/build.rs"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Espanso
        run: cargo build --release

      - name: Build Windows resources
        shell: pwsh
        run: |
          $env:EXEC_PATH = "target\release\espanso.exe"
          scripts\build_windows_resources.ps1

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          Install-Module -Name PSTOML -Force -Scope CurrentUser
          scripts\build_windows_installer.ps1

      - name: Build portable archive
        shell: pwsh
        run: scripts\build_windows_portable.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Espanso-Windows-Emoji-Font
          path: |
            target/windows/Espanso-Win-Installer-x86_64.exe
            target/windows/Espanso-Win-Portable-x86_64.zip
          if-no-files-found: error
